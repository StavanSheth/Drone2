version: '3.8'

services:
  backend:
    build:
      context: ../../
      dockerfile: deployment/docker/backend.Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ../../data:/app/data
    environment:
      - SERIAL_PORT=COM3

  frontend:
    build:
      context: ../../
      dockerfile: deployment/docker/frontend.Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
