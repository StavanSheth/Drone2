apiVersion: apps/v1
kind: Deployment
metadata:
  name: drone-backend
  namespace: drone-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: drone-backend
  template:
    metadata:
      labels:
        app: drone-backend
    spec:
      containers:
      - name: backend
        image: drone-backend:latest
        ports:
        - containerPort: 8000
